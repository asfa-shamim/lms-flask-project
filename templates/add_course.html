{% extends 'base.html' %}

{% block body %}

<div class="row justify-content-center">

<div class="col-md-7">

    <div class="card shadow-lg border-0 p-4">

        <h2 class="text-center text-primary fw-bold mb-4">
            Add New Course
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Course Title
                </label>
                 <input
                    type="text"
                    class="form-control"
                    name="title"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Instructor Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="instructor"
                    required
                >
            </div>
             <div class="mb-4">
                <label class="form-label fw-bold">
                    Description
                </label>

                <textarea
                    class="form-control"
                    rows="5"
                    name="description"
                    required
                ></textarea>
            </div>

            <button class="btn btn-success w-100">
                Add Course
            </button>

        </form>

    </div>

</div>
</div>

{% endblock body %}
