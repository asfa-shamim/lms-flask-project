{% extends 'base.html' %}

{% block body %}

<div class="text-center mb-5">
    <h1 class="display-4 fw-bold text-primary">
        Learning Management System
    </h1>

    <p class="lead text-muted">
        Manage your online courses easily.
    </p>
</div>

<div class="row">

{% for course in courses %}

<div class="col-md-4 mb-4">

    <div class="card shadow-lg border-0 h-100 course-card">
         <div class="card-body">

            <h3 class="card-title text-primary fw-bold">
                {{ course.title }}
            </h3>

            <h6 class="text-dark">
                Instructor: {{ course.instructor }}
            </h6>

            <p class="text-muted mt-3">
                {{ course.description }}
            </p>

        </div>

        <div class="card-footer bg-white border-0 pb-4">
              <a href="/update/{{course.id}}" class="btn btn-primary">
                Update
            </a>

            <a href="/delete/{{course.id}}" class="btn btn-danger">
                Delete
            </a>

        </div>

    </div>

</div>

{% endfor %}

</div>

{% endblock body %}
